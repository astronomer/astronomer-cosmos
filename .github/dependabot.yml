version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      # Keep github/codeql-action/init and github/codeql-action/analyze in a single PR.
      # CodeQL requires init and analyze to run the same version; bumping them in
      # separate PRs leaves the pair version-skewed and fails the Analyze job.
      codeql-action:
        patterns:
          - "github/codeql-action*"
    labels:
      - "dependencies"
    reviewers:
      - "@astronomer/oss-integrations"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    reviewers:
      - "@astronomer/oss-integrations"
