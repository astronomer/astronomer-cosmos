name: Clean up BigQuery CI datasets

# Each CI job deletes its own BigQuery dataset (cosmos_ci_*) when it finishes. This scheduled workflow removes the ones
# that were left behind (timeouts, runner crashes). It runs only from the default branch, never on pull requests.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Delete datasets older than 24 hours
        env:
          AIRFLOW_CONN_GCP_GS_CONN: ${{ secrets.AIRFLOW_CONN_GCP_GS_CONN }}
          BIGQUERY_PROJECT: astronomer-dag-authoring
        run: |
          python -m pip install "google-cloud-bigquery==3.25.0"
          python scripts/ci/delete_stale_bigquery_datasets.py
