name: test-dbt-v2

# Integration tests for dbt v2 (dbt-oss). dbt v2 does not support the Postgres adapter that the tests in test.yml use, so
# this workflow runs a small, dedicated set of tests (tests/dbt_v2) against BigQuery instead. test.yml is unchanged.
on:
  push: # Run on pushes to the default branch
    branches: [main, ci/run-integration-tests-dbt-oss] # TEMPORARY: revert before merge
    paths:
      - "cosmos/**"
      - "tests/**"
      - "scripts/test/**"
      - "pyproject.toml"
      - "requirements/**"
      - ".github/workflows/test-dbt-v2.yml"
  # Uses secrets, so it depends on the Authorize job, which requires manually approving the workflow run for external PRs
  # (same as test.yml). Pull requests use the workflow file from the base branch.
  pull_request_target:
    branches: [main, 'release-*'] # zizmor: ignore[dangerous-triggers]
    paths:
      - "cosmos/**"
      - "tests/**"
      - "scripts/test/**"
      - "pyproject.toml"
      - "requirements/**"
      - ".github/workflows/test-dbt-v2.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  SCARF_NO_ANALYTICS: "true"

jobs:
  Authorize:
    environment: ${{ github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      'external' || 'internal' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: true

  Run-dbt-v2-Tests:
    needs: Authorize
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        airflow-version: ["2.10", "3.0", "3.1"]
        dbt-version: ["v2-oss"]
    env:
      # One BigQuery dataset per job, so concurrent jobs do not write to the same tables. The tests read it, and the last
      # step deletes it. The name only has ids, so it is a valid dataset name (no dots, unlike the matrix).
      COSMOS_TEST_BIGQUERY_DATASET: cosmos_ci_${{ github.run_id }}_${{ github.run_attempt }}_v2_${{ strategy.job-index }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false
          # Safe under pull_request_target: this job runs only after the Authorize job's
          # owner-review environment gate approves the run (see the Authorize job above).
          allow-unsafe-pr-checkout: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install packages and dependencies
        run: |
          python -m pip install uv
          uv pip install --system "hatch>=1.14.2"
          hatch -e tests.py${{ matrix.python-version }}-${{ matrix.airflow-version }}-${{ matrix.dbt-version }} run pip freeze

      - name: Create the BigQuery dataset
        # dbt creates a missing dataset itself, but BigQuery does not always make it visible straight away, which made
        # the first seed fail with "Not found: Dataset". Create it here and wait until it can be read. Inline code in
        # isolated mode (-I), and only for names that start with cosmos_ci_.
        env:
          AIRFLOW_CONN_GCP_GS_CONN: ${{ secrets.AIRFLOW_CONN_GCP_GS_CONN }}
          BIGQUERY_PROJECT: astronomer-dag-authoring
        run: |
          hatch run "tests.py${{ matrix.python-version }}-${{ matrix.airflow-version }}-${{ matrix.dbt-version }}:python" -I - <<'PY'
          import json
          import os
          import time

          from airflow.models.connection import Connection
          from google.api_core.exceptions import NotFound
          from google.cloud import bigquery
          from google.oauth2 import service_account

          dataset = os.environ["COSMOS_TEST_BIGQUERY_DATASET"]
          if not dataset.startswith("cosmos_ci_"):
              raise SystemExit(f"Refusing to create dataset {dataset!r}: it does not start with 'cosmos_ci_'")

          raw = os.environ["AIRFLOW_CONN_GCP_GS_CONN"]
          conn = Connection.from_json(raw) if raw.lstrip().startswith("{") else Connection(uri=raw)
          extra = conn.extra_dejson
          keyfile = extra.get("keyfile_dict") or extra.get("extra__google_cloud_platform__keyfile_dict")
          if isinstance(keyfile, str):
              keyfile = json.loads(keyfile)
          credentials = service_account.Credentials.from_service_account_info(keyfile)
          client = bigquery.Client(project=os.environ["BIGQUERY_PROJECT"], credentials=credentials)

          print(f"Creating BigQuery dataset {dataset}")
          client.create_dataset(dataset, exists_ok=True)
          for _ in range(30):
              try:
                  client.get_dataset(dataset)
                  break
              except NotFound:
                  time.sleep(2)
          else:
              raise SystemExit(f"BigQuery dataset {dataset} is still not visible after 60 seconds")
          PY

      - name: Test Cosmos against Airflow ${{ matrix.airflow-version }}, Python ${{ matrix.python-version }} and dbt ${{ matrix.dbt-version }}
        run: |
          HATCH_ENV="tests.py${{ matrix.python-version }}-${{ matrix.airflow-version }}-${{ matrix.dbt-version }}"
          hatch run "$HATCH_ENV:test-integration-dbt-v2-setup"
          hatch run "$HATCH_ENV:test-dbt-v2"
        env:
          AIRFLOW_HOME: /home/runner/work/astronomer-cosmos/astronomer-cosmos/
          AIRFLOW_CONN_GCP_GS_CONN: ${{ secrets.AIRFLOW_CONN_GCP_GS_CONN }}
          COSMOS_TEST_DBT_V2: "1"
          PYTHONPATH: /home/runner/work/astronomer-cosmos/astronomer-cosmos/:$PYTHONPATH
          AIRFLOW__COSMOS__ENABLE_CACHE: 0

      - name: Delete the BigQuery dataset
        # Runs on success, failure and cancellation. Inline code in isolated mode (-I), and it only deletes datasets named
        # cosmos_ci_*. The credentials need to be able to delete only the datasets they created (not a project-wide delete).
        if: always()
        env:
          AIRFLOW_CONN_GCP_GS_CONN: ${{ secrets.AIRFLOW_CONN_GCP_GS_CONN }}
          BIGQUERY_PROJECT: astronomer-dag-authoring
        run: |
          hatch run "tests.py${{ matrix.python-version }}-${{ matrix.airflow-version }}-${{ matrix.dbt-version }}:python" -I - <<'PY'
          import json
          import os

          from airflow.models.connection import Connection
          from google.cloud import bigquery
          from google.oauth2 import service_account

          dataset = os.environ.get("COSMOS_TEST_BIGQUERY_DATASET")
          if not dataset:
              raise SystemExit("No BigQuery dataset was set for this job, nothing to delete")
          if not dataset.startswith("cosmos_ci_"):
              raise SystemExit(f"Refusing to delete dataset {dataset!r}: it does not start with 'cosmos_ci_'")

          raw = os.environ["AIRFLOW_CONN_GCP_GS_CONN"]
          conn = Connection.from_json(raw) if raw.lstrip().startswith("{") else Connection(uri=raw)
          extra = conn.extra_dejson
          keyfile = extra.get("keyfile_dict") or extra.get("extra__google_cloud_platform__keyfile_dict")
          if isinstance(keyfile, str):
              keyfile = json.loads(keyfile)
          credentials = service_account.Credentials.from_service_account_info(keyfile)
          client = bigquery.Client(project=os.environ["BIGQUERY_PROJECT"], credentials=credentials)
          print(f"Deleting BigQuery dataset {dataset}")
          client.delete_dataset(dataset, delete_contents=True, not_found_ok=True)
          PY
