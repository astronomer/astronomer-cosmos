# Profile baked into the image of Dockerfile.bigquery_dbt_oss_k8s. The DAGs set POSTGRES_DB and POSTGRES_SCHEMA in the pod,
# so the project and dataset come from variables of the image instead. POSTGRES_PASSWORD holds the service account key.
default:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account-json
      keyfile_json: "{{ env_var('POSTGRES_PASSWORD') | as_native }}"
      project: "{{ env_var('COSMOS_TEST_BIGQUERY_PROJECT') }}"
      dataset: "{{ env_var('COSMOS_TEST_BIGQUERY_DATASET') }}"
      threads: 4
